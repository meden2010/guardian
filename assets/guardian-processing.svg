    <g id="walking-bug">
      <use href="#bug-frame-a" class="leg-a"/>
      <use href="#bug-frame-b" class="leg-b"/>
    </g>
  </defs>

  <style>
    .pose-guard { animation: guardVis 1.4s steps(1, end) infinite; }
    .pose-windup { animation: windupVis 1.4s steps(1, end) infinite; }
    .pose-slash { animation: slashVis 1.4s steps(1, end) infinite; }
    .slash-fx { animation: slashFx 1.4s ease-out infinite; }
    .sparks-fx { animation: sparksFx 1.4s ease-out infinite; }
    .leg-a { animation: legToggleA 0.28s steps(1, end) infinite; }
    .leg-b { animation: legToggleB 0.28s steps(1, end) infinite; }
    .bug-front { animation: bugFrontMove 1.4s linear infinite; }
    .bug-mid   { animation: bugMidMove   1.4s linear infinite; }
    .bug-back  { animation: bugBackMove  1.4s linear infinite; }
    .half-top { animation: sliceTop 1.4s ease-out infinite; }
    .half-bot { animation: sliceBot 1.4s ease-out infinite; }
    .portal-glow { animation: portalPulse 1.4s ease-in-out infinite; }

    @keyframes guardVis {
      0%, 100% { opacity: 1; }
      33% { opacity: 0; }
      72% { opacity: 1; }
    }
    @keyframes windupVis {
      0%, 100% { opacity: 0; }
      33% { opacity: 1; }
      45% { opacity: 0; }
    }
    @keyframes slashVis {
      0%, 100% { opacity: 0; }
      45% { opacity: 1; }
      72% { opacity: 0; }
    }
    @keyframes slashFx {
      0%, 44.9% { opacity: 0; transform: translate(-2px, 0); }
      45% { opacity: 1; transform: translate(0, 0); }
      64% { opacity: 0; transform: translate(4px, 0); }
      100% { opacity: 0; }
    }
    @keyframes sparksFx {
      0%, 44.9% { opacity: 0; transform: translate(0, 0); }
      45% { opacity: 1; transform: translate(0, 0); }
      70% { opacity: 0; transform: translate(5px, -2px); }
      100% { opacity: 0; }
    }
    @keyframes legToggleA {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes legToggleB {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes bugFrontMove {
      0%    { transform: translate(54px, 22px); opacity: 1; }
      44.9% { transform: translate(35.1px, 22px); opacity: 1; }
      45%, 100% { transform: translate(35.1px, 22px); opacity: 0; }
    }
    @keyframes bugMidMove {
      0%   { transform: translate(96px, 22px); }
      100% { transform: translate(54px, 22px); }
    }
    @keyframes bugBackMove {
      0%   { transform: translate(138px, 22px); }
      100% { transform: translate(96px, 22px); }
    }
    @keyframes sliceTop {
      0%, 44.9% { opacity: 0; transform: translate(35px, 22px); }
      45% { opacity: 1; transform: translate(35px, 21px); }
      80% { opacity: 0; transform: translate(45px, 13px); }
      100% { opacity: 0; transform: translate(45px, 13px); }
    }
    @keyframes sliceBot {
      0%, 44.9% { opacity: 0; transform: translate(35px, 26px); }
      45% { opacity: 1; transform: translate(35px, 26px); }
      80% { opacity: 0; transform: translate(47px, 29px); }
      100% { opacity: 0; transform: translate(47px, 29px); }
    }
    @keyframes portalPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }
  </style>

  <rect x="0.5" y="0.5" width="111" height="39" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="6" y="4" width="100" height="31" rx="2" fill="#161b22" stroke="#21262d" stroke-width="0.75"/>

