      <path fill="#475569" d="M2 0h1v1h-1zM5 0h1v1h-1zM2 1h2v1h-2zM2 6h1v1h-1zM2 7h1v1h-1zM5 7h1v1h-1zM8 7h1v1h-1zM11 7h1v1h-1zM3 8h1v1h-1zM6 8h1v1h-1zM9 8h1v1h-1z"/>
