<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 40" width="336" height="120" role="img" aria-label="Guardian knight slicing incoming bugs">
  <defs>
    <clipPath id="arena-clip">
      <rect x="6" y="4" width="100" height="31" rx="2"/>
    </clipPath>
    <g id="bug-frame-a" shape-rendering="crispEdges">
